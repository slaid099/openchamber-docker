name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest versions
        id: versions
        run: |
          set -euo pipefail
          openchamber="$(npm view @openchamber/web version)"
          opencode="$(npm view '@opencode/cli@2' version --json | jq -r 'if type == "array" then .[-1] else . end')"
          echo "openchamber=${openchamber}" >> "$GITHUB_OUTPUT"
          echo "opencode=${opencode}" >> "$GITHUB_OUTPUT"
          echo "OpenChamber ${openchamber}, OpenCode ${opencode}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openchamber
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.openchamber }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_VERSION=${{ steps.versions.outputs.openchamber }}
            OPENCODE_VERSION=${{ steps.versions.outputs.opencode }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
